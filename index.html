<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你在友情里是什么人格</title>
<style>
  :root {
    --bg: #FFF7F0; --card: #FFFFFF; --ink: #4A3F38; --soft: #9B8B80;
    --coral: #E8836B; --coral-deep: #D96A50; --peach: #FFE3D6; --line: #F2E4DA;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; max-width: 480px; margin: 0 auto; overflow-x: hidden;
  }
  .page { display:none; padding: 24px 20px 40px; animation: fade .35s ease; }
  .page.show { display:block; }
  @keyframes fade { from {opacity:0; transform:translateY(8px);} to {opacity:1; transform:none;} }

  /* 首页 */
  .home { padding-top: 72px; text-align:center; }
  .home .emoji { font-size: 56px; }
  .home h1 { font-size: 30px; line-height:1.35; margin: 20px 0 12px; letter-spacing:1px; }
  .home .sub { color: var(--soft); font-size: 15px; line-height:1.7; }
  .home .meta { margin-top: 28px; color: var(--soft); font-size: 13px; }
  .btn {
    display:block; width:100%; padding: 16px; border:none; border-radius: 28px;
    background: var(--coral); color:#fff; font-size: 17px; letter-spacing: 2px;
    margin-top: 36px; cursor:pointer; box-shadow: 0 8px 20px rgba(232,131,107,.35);
  }
  .btn:active { background: var(--coral-deep); }
  .btn.ghost { background:transparent; color:var(--soft); box-shadow:none; border:1px solid var(--line); margin-top:14px; font-size:14px; letter-spacing:1px; }

  /* 答题 */
  .progress-wrap { display:flex; align-items:center; gap: 10px; margin-bottom: 26px; }
  .progress-bar { flex:1; height: 6px; background: var(--peach); border-radius: 3px; overflow:hidden; }
  .progress-bar i { display:block; height:100%; width:0; background: var(--coral); border-radius:3px; transition: width .3s ease; }
  .progress-num { font-size: 12px; color: var(--soft); min-width: 46px; text-align:right; }
  .qtext { font-size: 20px; line-height: 1.6; margin: 8px 0 26px; font-weight: 600; }
  .opt {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 15px 16px; margin-bottom: 12px; font-size: 15px; line-height:1.55;
    cursor:pointer; transition: all .15s ease; color: var(--ink);
  }
  .opt:active { border-color: var(--coral); background: var(--peach); }
  .back {
    display:none; margin: 18px auto 0; background:transparent; border:none;
    color: var(--soft); font-size: 14px; letter-spacing: 1px; cursor:pointer; padding: 8px 16px;
  }
  .back.show { display:block; }
  /* 校验码 */
  .gate { margin-top: 30px; }
  .gate-tip { color: var(--soft); font-size: 14px; letter-spacing: 2px; margin-bottom: 12px; }
  .code-input {
    width: 200px; padding: 14px 0; text-align: center; font-size: 30px; letter-spacing: 12px;
    text-indent: 12px; border: 1.5px solid var(--line); border-radius: 16px; outline: none;
    background: var(--card); color: var(--ink); font-family: inherit;
  }
  .code-input:focus { border-color: var(--coral); }
  .gate-err { color: #D9534F; font-size: 13px; height: 20px; margin-top: 8px; }
  .gate-note { color: var(--soft); font-size: 12px; line-height: 1.8; margin-top: 18px; }
  .gate-note.ok { color: var(--coral-deep); }
  .gate .btn { margin-top: 14px; }

  /* 结果页 */
  .result-head { text-align:center; padding-top: 26px; }
  .result-head .label { color: var(--soft); font-size: 14px; letter-spacing: 4px; }
  .result-head .name { font-size: 38px; font-weight: 700; color: var(--coral-deep); margin: 10px 0 4px; letter-spacing:2px; }
  .result-head .sig { color: var(--ink); font-size: 16px; margin-top: 8px; line-height:1.6; }
  .card {
    background: var(--card); border-radius: 20px; padding: 22px 20px; margin-top: 26px;
    box-shadow: 0 6px 24px rgba(74,63,56,.06);
  }
  .dimrow { display:flex; justify-content:space-between; align-items:center; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .dimrow:last-child { border-bottom:none; }
  .dimrow .stars { color: var(--coral); letter-spacing: 2px; font-size: 15px; }
  .blind { margin-top: 20px; padding: 14px 16px; background: var(--bg); border-radius: 14px; font-size: 14px; line-height: 1.8; color: var(--soft); }
  .blind b { color: var(--ink); display:block; margin-bottom: 4px; font-size:13px; letter-spacing:2px; }
  .share-tip { text-align:center; color: var(--soft); font-size: 13px; margin-top: 18px; line-height:1.7; }
  #shot { display:none; }
</style>
</head>
<body>

<!-- 首页 -->
<div class="page home show" id="pgHome">
  <div class="emoji">🫧</div>
  <h1>测测你在友情里<br>是什么人格</h1>
  <div class="sub">30 道题，看看你是树洞所长<br>还是快乐搭子</div>
  <div class="meta">约需 5 分钟 · 结果供你参考与自查</div>
  <div class="gate" id="gate">
    <div class="gate-tip">请输入 4 位数字校验码</div>
    <input id="codeInput" class="code-input" type="tel" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="····">
    <div class="gate-err" id="gateErr"></div>
    <button class="btn" onclick="checkCode()">验 证 校 验 码</button>
    <div class="gate-note">测试不限使用次数和时间<br>如有问题请第一时间联系客服帮您解决~</div>
  </div>
  <div id="startArea" style="display:none">
    <button class="btn" onclick="startQuiz()">开 始 测 试</button>
    <div class="gate-note ok">校验通过，祝各位宝子生活愉快！</div>
  </div>
</div>

<!-- 答题页 -->
<div class="page" id="pgQuiz">
  <div class="progress-wrap">
    <div class="progress-bar"><i id="pbar"></i></div>
    <div class="progress-num" id="pnum">1/30</div>
  </div>
  <div class="qtext" id="qtext"></div>
  <div id="opts"></div>
  <button class="back" id="backBtn" onclick="goBack()">← 返回上一题</button>
</div>

<!-- 结果页 -->
<div class="page" id="pgResult">
  <div class="result-head">
    <div class="label">我的友情人格</div>
    <div class="name" id="rname"></div>
    <div class="sig" id="rsig"></div>
  </div>
  <div class="card">
    <div id="rdims"></div>
    <div class="blind"><b>小 提 醒</b><span id="rblind"></span></div>
  </div>
  <div class="share-tip">长按屏幕截图，保存你的友情人格卡<br>去测测你最好的朋友是什么人格吧</div>
  <button class="btn" onclick="saveShot()">保 存 结 果 图</button>
  <button class="btn ghost" onclick="location.reload()">再测一次</button>
  <canvas id="shot" width="750" height="1100"></canvas>
</div>

<script>
const QUIZ = {"questions": [{"id": 1, "q": "周五晚上，朋友群安静了一整天，你会？", "options": [{"t": "直接发起新局，@所有人", "pull": {"k": 2, "n": -1}, "sig": ["r4"]}, {"t": "私聊那个最聊得来的，两个人小聚", "pull": {"n": 2, "k": -1}, "sig": ["r8"]}, {"t": "等人先开口，来约就去", "pull": {"k": -2}, "sig": ["r1", "r7"]}, {"t": "正好，攒了一周的剧要补", "pull": {"n": -1, "f": 1}, "sig": ["r9"]}]}, {"id": 2, "q": "朋友第三次跟你吐槽同一个人，你？", "options": [{"t": "照样认真听完，先接住情绪", "pull": {"d": -2, "t": -1}, "sig": ["r1"]}, {"t": "直接直白提醒：一直重复吐槽解决不了问题", "pull": {"d": 2, "t": 2}, "sig": ["r5"]}, {"t": "帮TA分析利弊，这次给个方案", "pull": {"t": 1}, "sig": ["r10"]}, {"t": "嗯嗯啊啊应付，心里已经累了", "pull": {"d": -1, "t": -2}, "sig": ["r7"]}]}, {"id": 3, "q": "你和好朋友同时喜欢上了一个人，你？", "options": [{"t": "摊开说，公平竞争", "pull": {"t": 2, "d": 1}, "sig": ["r2", "r5"]}, {"t": "默默退出，友情比感情重要", "pull": {"d": -2, "f": 1}, "sig": ["r7"]}, {"t": "谁也不说，自己消化", "pull": {"t": -2}, "sig": ["r8"]}, {"t": "先看TA的态度再决定", "pull": {"k": -1, "d": -1}, "sig": ["r1"]}]}, {"id": 4, "q": "朋友找你借一笔中等数额的钱，承诺下个月归还，你？", "options": [{"t": "直接转，开口一次不容易", "pull": {"d": -2}, "sig": ["r1", "r7"]}, {"t": "可以，但欠条照写——朋友归朋友，账要清楚", "pull": {"d": 2, "t": 1}, "sig": ["r5"]}, {"t": "借 500 说不用还，把数额划在自己舒服的线内", "pull": {"d": 1, "f": 1}, "sig": ["r3"]}, {"t": "装没看见，就当消息没发过", "pull": {"n": -1, "f": 2, "t": -1}, "sig": ["r9"]}]}, {"id": 5, "q": "和朋友旅行，TA 屡次长时间迟到耽误行程，最后一天你？", "options": [{"t": "当面说清楚：明天集合，别再迟到", "pull": {"t": 2}, "sig": ["r2", "r5"]}, {"t": "忍着不说，心里决定再也不约了", "pull": {"t": -2, "f": 2}, "sig": ["r3"]}, {"t": "开玩笑点出来，不伤面子", "pull": {"t": 1, "d": -1}, "sig": ["r10"]}, {"t": "算了，出来玩开心最重要", "pull": {"f": 1, "n": -1}, "sig": ["r9"]}]}, {"id": 6, "q": "你搬家或者生病需要人搭把手时，第一个想到的是？", "options": [{"t": "那个平时话不多、但一定会来的老友", "pull": {"n": 2}, "sig": ["r8"]}, {"t": "谁有空找谁，不麻烦特定的人", "pull": {"n": -2, "d": -1}, "sig": ["r9"]}, {"t": "尽量谁都不麻烦，自己扛", "pull": {"d": -2, "k": -1}, "sig": ["r7"]}, {"t": "那个会帮你把事安排得明明白白的人", "pull": {"k": -1, "t": 1}, "sig": ["r10"]}]}, {"id": 7, "q": "群里两个朋友吵起来了，火药味很重，你？", "options": [{"t": "私下两头劝，把局保住", "pull": {"t": 2, "d": -1}, "sig": ["r10"]}, {"t": "群里直接说：有话好好说", "pull": {"t": 2, "k": 1}, "sig": ["r2"]}, {"t": "不站队，默默潜水看发展", "pull": {"t": -2}, "sig": ["r3"]}, {"t": "站该站的那边，不装和事佬", "pull": {"d": 1, "t": 1}, "sig": ["r2", "r5"]}]}, {"id": 8, "q": "你发了一条流露低落情绪的公开动态，你其实希望？", "options": [{"t": "有人立刻私聊问你怎么了", "pull": {"k": -2, "n": 1}, "sig": ["r1"]}, {"t": "只是想说出来，不想被追问，过一会儿就删掉", "pull": {"t": -2, "f": -1}, "sig": ["r8", "r6"]}, {"t": "点赞的每一个人都算安慰", "pull": {"n": -1}, "sig": ["r9"]}, {"t": "比起「抱抱」，更想有人问一句：需要我做点什么", "pull": {"d": 1, "t": 1}, "sig": ["r5"]}]}, {"id": 9, "q": "很久没联系的老朋友，突然翻到你旧动态点赞，你？", "options": [{"t": "立刻私聊：最近怎么样", "pull": {"k": 2, "f": 1}, "sig": ["r4"]}, {"t": "心里动了一下，但忍住没发", "pull": {"f": -2, "k": -1}, "sig": ["r6"]}, {"t": "点回去一个赞，礼尚往来", "pull": {"f": 1, "n": -1}, "sig": ["r9"]}, {"t": "无感，划过去了", "pull": {"f": 2}, "sig": ["r3"]}]}, {"id": 10, "q": "友谊里最让你受不了的一件事是？", "options": [{"t": "被无视：消息发出去石沉大海", "pull": {"k": -1}, "sig": ["r1"]}, {"t": "被消耗：总是一方付出一方装死", "pull": {"d": -1, "t": -1}, "sig": ["r7"]}, {"t": "被越界：TA随便替你做决定", "pull": {"d": 2}, "sig": ["r5"]}, {"t": "被绑架：动不动就是「我们这么多年」", "pull": {"d": 1, "f": 1}, "sig": ["r3"]}]}, {"id": 11, "q": "答应朋友的事，你发现做不到，你会？", "options": [{"t": "提前跟TA说明难处，一起商量改期或换个办法", "pull": {"t": 1, "d": 1}, "sig": ["r5"]}, {"t": "先自己扛着，实在扛不住了才说", "pull": {"d": -2, "t": -1}, "sig": ["r7"]}, {"t": "心虚，干脆不回消息，拖到不了了之", "pull": {"t": -2, "f": 1}, "sig": ["r9"]}, {"t": "转头找别人帮忙顶上，不让TA知道", "pull": {"k": 1, "d": -1}, "sig": ["r10"]}]}, {"id": 12, "q": "你们吵架冷战到了第二天，你？", "options": [{"t": "忍不住主动发消息缓和气氛，哪怕主动开口不代表认错", "pull": {"t": 1, "d": -1}, "sig": ["r10", "r1"]}, {"t": "等对方先低头，不然就冷到底", "pull": {"t": -2, "d": 1}, "sig": ["r3"]}, {"t": "找个共同朋友递话，侧面缓和", "pull": {"t": 1, "k": -1}, "sig": ["r10"]}, {"t": "该吃吃该睡睡，时间会解决", "pull": {"f": 2, "t": -1}, "sig": ["r9"]}]}, {"id": 13, "q": "朋友迎来很好的喜事，而你正处在低谷，你？", "options": [{"t": "真心替TA高兴，约饭庆祝", "pull": {"k": 1, "f": 1}, "sig": ["r2", "r4"]}, {"t": "高兴是真的，但有点说不出的失落", "pull": {"f": -1, "n": 1}, "sig ", "d", "t", "n", "f"], "dimNames": {"k": "开口度", "d": "底线感", "t": "摊牌度", "n": "浓度", "f": "翻篇度"}};
const DIMS = QUIZ.dims, DIMN = QUIZ.dimNames, RES = QUIZ.results;

let idx = 0, picks = [];

function $(id){ return document.getElementById(id); }
function show(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  $(pg).classList.add('show');
  window.scrollTo(0,0);
}

function startQuiz(){ idx = 0; picks = []; renderQ(); show('pgQuiz'); }

/* ===== 校验码（改在这里换码）===== */
const CODE = '9788';
function checkCode(){
  const v = ($('codeInput').value || '').trim();
  if (v === CODE) {
    $('gate').style.display = 'none';
    $('startArea').style.display = 'block';
    $('gateErr').textContent = '';
  } else {
    $('gateErr').textContent = '校验码不对，请注意不能有空格，再试一次';
    $('codeInput').value = '';
    $('codeInput').focus();
  }
}
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkCode(); });

function renderQ(){
  const q = QUIZ.questions[idx];
  $('pbar').style.width = (idx / QUIZ.questions.length * 100) + '%';
  $('pnum').textContent = (idx+1) + '/' + QUIZ.questions.length;
  $('qtext').textContent = q.q;
  const box = $('opts'); box.innerHTML = '';
  q.options.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'opt'; d.textContent = o.t;
    d.onclick = () => pick(i);
    box.appendChild(d);
  });
  $('backBtn').classList.toggle('show', idx > 0);
}

function goBack(){
  if (idx === 0) return;
  idx--;
  picks.pop();
  renderQ();
}

function pick(i){
  picks.push(QUIZ.questions[idx].options[i]);
  idx++;
  if (idx < QUIZ.questions.length) renderQ();
  else { $('pbar').style.width = '100%'; calcResult(); }
}

/* 计分：与题库 meta.scoring 完全一致 */
function calcResult(){
  const sums = {k:0,d:0,t:0,n:0,f:0}, maxabs = {k:0,d:0,t:0,n:0,f:0};
  QUIZ.questions.forEach(q => q.options.forEach(o => {
    for (const k in o.pull) maxabs[k] = Math.max(maxabs[k], Math.abs(o.pull[k]));
  }));
  picks.forEach(o => { for (const k in o.pull) sums[k] += o.pull[k]; });
  const coord = DIMS.map(k => {
    const cap = maxabs[k] * QUIZ.questions.length * 0.6;
    return Math.max(-5, Math.min(5, sums[k] / cap * 5));
  });
  const ids = Object.keys(RES);
  let best = null, bd = Infinity;
  ids.forEach(r => {
    const c = RES[r].coord;
    const d2 = DIMS.reduce((s,_,i) => s + (coord[i]-c[i])**2, 0);
    if (d2 < bd || (d2 === bd && best && parseInt(r.slice(1)) < parseInt(best.slice(1)))) { bd = d2; best = r; }
  });
  renderResult(best, coord);
}

function stars(v){ return v > 1.5 ? '★★★' : (v < -1.5 ? '★☆☆' : '★★☆'); }

function renderResult(rid, coord){
  const r = RES[rid];
  $('rname').textContent = r.name;
  const meta = CARDS[rid];
  $('rsig').textContent = meta.sig;
  $('rblind').textContent = meta.blind;
  $('rdims').innerHTML = DIMS.map((k,i) =>
    '<div class="dimrow"><span>我的' + DIMN[k] + '</span><span class="stars">' + stars(coord[i]) + '</span></div>'
  ).join('');
  window._lastResult = { rid, name: r.name, coord: coord.slice() };
  show('pgResult');
}

function saveShot(){
  const c = $('shot'), x = c.getContext('2d');
  const { name } = window._lastResult;
  x.fillStyle = '#FFF7F0'; x.fillRect(0,0,750,1100);
  x.fillStyle = '#E8836B'; x.font = '600 30px sans-serif'; x.textAlign='center';
  x.fillText('🫧', 375, 150);
  x.fillStyle = '#9B8B80'; x.font = '26px sans-serif';
  x.fillText('我 的 友 情 人 格', 375, 250);
  x.fillStyle = '#D96A50'; x.font = 'bold 76px sans-serif';
  x.fillText(name, 375, 360);
  const meta = CARDS[window._lastResult.rid];
  x.fillStyle = '#4A3F38'; x.font = '30px sans-serif';
  wrap(x, meta.sig, 375, 440, 560, 44);
  const dimNames = ['开口度','底线感','摊牌度','浓度','翻篇度'];
  x.textAlign = 'left';
  window._lastResult.coord.forEach((v,i) => {
    const y = 560 + i*78;
    x.fillStyle = '#FFFFFF'; roundRect(x, 95, y-38, 560, 64, 16); x.fill();
    x.fillStyle = '#4A3F38'; x.font = '28px sans-serif';
    x.fillText('我的' + dimNames[i], 130, y+8);
    x.fillStyle = '#E8836B'; x.font = '28px sans-serif'; x.textAlign='right';
    x.fillText(stars(v), 620, y+8); x.textAlign='left';
  });
  x.textAlign='center';
  x.fillStyle = '#9B8B80'; x.font = '24px sans-serif';
  x.fillText('测测你最好的朋友是什么人格', 375, 1030);
  const a = document.createElement('a');
  a.download = '我的友情人格_' + name + '.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
function wrap(x, text, cx, y, maxW, lh){
  let line = '', yy = y;
  for (const ch of text) {
    if (x.measureText(line + ch).width > maxW) { x.fillText(line, cx, yy); line = ch; yy += lh; }
    else line += ch;
  }
  if (line) x.fillText(line, cx, yy);
}
function roundRect(x, px, py, w, h, r){
  x.beginPath(); x.moveTo(px+r,py);
  x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r);
  x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath();
}
